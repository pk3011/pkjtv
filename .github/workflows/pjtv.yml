name: Auto Update JioTV Cookie gist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-cookie:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (runtime only)
        uses: actions/checkout@v4

      - name: Download pjtv.m3u from Gist
        run: |
          set -e

          curl -L \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -o pjtv_old.m3u \
            https://gist.githubusercontent.com/${{ github.actor }}/${{ secrets.GIST_ID }}/raw/pjtv.m3u

          if [ ! -s pjtv_old.m3u ]; then
            echo "❌ Failed to download pjtv.m3u"
            exit 1
          fi

          cp pjtv_old.m3u pjtv.m3u

      - name: Extract tvg-id list
        run: |
          set -e

          IDS=$(grep -o 'tvg-id="[0-9]\+"' pjtv.m3u | cut -d'"' -f2 | sort -u)

          if [ -z "$IDS" ]; then
            echo "❌ No tvg-id found"
            exit 1
          fi

          echo "📺 Found IDs:"
          echo "$IDS"

          echo "IDS<<EOF" >> $GITHUB_ENV
          echo "$IDS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Smart cookie update (skip valid cookies)
        run: |
          set -e

          NOW=$(date +%s)
          BUFFER=300   # 5 minutes buffer

          cp pjtv.m3u updated.m3u

          for ID in $IDS; do
            echo "🔍 Checking tvg-id: $ID"

            # Extract existing cookie from block
            CURRENT_COOKIE=$(awk -v id="$ID" '
              $0 ~ "tvg-id=\""id"\"" {
                for(i=1;i<=6;i++){
                  getline
                  if ($0 ~ /__hdnea__=/) {
                    match($0, /__hdnea__=[^"&]*/)
                    print substr($0, RSTART, RLENGTH)
                    exit
                  }
                }
              }' pjtv.m3u)

            EXP=$(echo "$CURRENT_COOKIE" | grep -o 'exp=[0-9]*' | cut -d= -f2)

            if [ ! -z "$EXP" ]; then
              if [ "$EXP" -gt $((NOW + BUFFER)) ]; then
                echo "⏭️ Skipping $ID (cookie still valid)"
                continue
              fi
            fi

            echo "🔄 Refreshing $ID"

            URL="${{ secrets.COOKIE_API_BASE }}?id=$ID"
            RESPONSE=$(curl -fsSL "$URL" || true)

            FULL_COOKIE=$(echo "$RESPONSE" | grep -o '__hdnea__=[^"]*' | head -n1)

            if [ -z "$FULL_COOKIE" ]; then
              echo "⚠️ Failed to fetch cookie for $ID"
              continue
            fi

            COOKIE_VALUE="${FULL_COOKIE#__hdnea__=}"

            # Replace only within that channel block
            awk -v id="$ID" -v fc="$FULL_COOKIE" -v cv="$COOKIE_VALUE" '
            {
              if ($0 ~ "tvg-id=\""id"\"") {
                print $0
                for(i=1;i<=6;i++){
                  getline
                  gsub(/"cookie":"__hdnea__=[^"]*"/, "\"cookie\":\""fc"\"")
                  gsub(/__hdnea__=[^&"]*/, "__hdnea__="cv)
                  print
                }
                next
              }
              print
            }' updated.m3u > temp.m3u && mv temp.m3u updated.m3u

            echo "✅ Updated $ID"
          done

          mv updated.m3u pjtv.m3u

      - name: Check if file changed
        id: diffcheck
        run: |
          set -e

          if cmp -s pjtv_old.m3u pjtv.m3u; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected"
          fi

      - name: Upload updated pjtv.m3u to Gist
        if: steps.diffcheck.outputs.changed == 'true'
        run: |
          set -e

          jq -n --rawfile content pjtv.m3u \
            '{files: {"pjtv.m3u": {content: $content}}}' > payload.json

          curl -s -X PATCH https://api.github.com/gists/${{ secrets.GIST_ID }} \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data @payload.json \
            | tee response.json

          if grep -q '"files"' response.json; then
            echo "✅ Gist updated successfully"
          else
            echo "❌ Gist update failed"
            cat response.json
            exit 1
          fi
