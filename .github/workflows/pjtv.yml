name: Build PKJTV Playlist

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Generate M3U + Prepare Gist JSON
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          python << 'EOF'
          import requests, json, os, urllib.parse

          API_URL = os.environ["API_URL"]
          OUTPUT_FILE = "pkjtv.m3u"

          headers = {
              "User-Agent": "JioTV.Plus/2.3.1_2041 (Linux;Android 14) ExoPlayerLib/2.18.1"
          }

          def extract_hdnea(url):
              try:
                  parsed = urllib.parse.urlparse(url)
                  query = urllib.parse.parse_qs(parsed.query)
                  return query.get("__hdnea__", [""])[0]
              except:
                  return ""

          res = requests.get(API_URL, headers=headers, timeout=20)
          res.raise_for_status()
          data = res.json()

          lines = ["#EXTM3U"]

          for cid, ch in data.items():
              name = ch.get("channelName", "Unknown")
              logo = ch.get("logo", "")
              genre = ch.get("genre", ["Unknown"])[0]
              mpd = ch.get("dashWidewinePlayUrl", "")
              keyid = ch.get("keyid", "")
              key = ch.get("key", "")

              if not mpd or not keyid or not key:
                  continue

              cookie = extract_hdnea(mpd)

              lines.append(f'#EXTINF:-1 tvg-id="{cid}" tvg-logo="{logo}" group-title="{genre}",{name}')
              lines.append("#KODIPROP:inputstream.adaptive.license_type=org.w3.clearkey")
              lines.append(f"#KODIPROP:inputstream.adaptive.license_key={keyid}:{key}")
              lines.append("#KODIPROP:inputstream.adaptive.manifest_type=mpd")

              # ✅ Add EXTHTTP cookie line
              if cookie:
                  lines.append(f'#EXTHTTP:{{"cookie":"__hdnea__={cookie}"}}')

              lines.append("#EXTVLCOPT:http-user-agent=JioTV.Plus/2.3.1_2041 (Linux;Android 14) ExoPlayerLib/2.18.1")
              lines.append(mpd)
              lines.append("")

          m3u_content = "\n".join(lines)

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              f.write(m3u_content)

          gist_payload = {
              "description": "Auto-updated PKJTV playlist",
              "public": False,
              "files": {
                  "pkjtv.m3u": {
                      "content": m3u_content
                  }
              }
          }

          with open("gist.json", "w", encoding="utf-8") as f:
              json.dump(gist_payload, f)

          print("M3U generated with fresh cookie successfully")
          EOF

      - name: Upload to Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -X PATCH "https://api.github.com/gists/$GIST_ID" \
          -H "Authorization: token $GH_TOKEN" \
          -H "Content-Type: application/json" \
          -d @gist.json
      - name: Upload to Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -X PATCH "https://api.github.com/gists/$GIST_ID" \
          -H "Authorization: token $GH_TOKEN" \
          -H "Content-Type: application/json" \
          -d @gist.json
